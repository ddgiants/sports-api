services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sports
      MYSQL_USER: sports
      MYSQL_PASSWORD: sports
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      # The API container must use the Compose service name, not 127.0.0.1.
      DATABASE_URL: mysql+asyncmy://sports:sports@db:3306/sports
      ESPN_BASE_URL: ${ESPN_BASE_URL:-https://site.web.api.espn.com/apis/site/v2/sports}
      ESPN_TIMEOUT_SECONDS: ${ESPN_TIMEOUT_SECONDS:-20}
      ESPN_MAX_RETRIES: ${ESPN_MAX_RETRIES:-3}
      ESPN_CONCURRENCY: ${ESPN_CONCURRENCY:-5}
      ESPN_NEWS_LIMIT: ${ESPN_NEWS_LIMIT:-50}
      ESPN_TEAM_LIMIT: ${ESPN_TEAM_LIMIT:-1000}
      ESPN_USER_AGENT: ${ESPN_USER_AGENT:-sports-api/1.0}
      ESPN_SOCCER_LEAGUES: ${ESPN_SOCCER_LEAGUES:-eng.1,usa.1}
      ESPN_INCLUDE_TEAM_DETAILS: ${ESPN_INCLUDE_TEAM_DETAILS:-true}
      ESPN_STRICT_SYNC: ${ESPN_STRICT_SYNC:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["serve"]

volumes:
  mysql_data:
